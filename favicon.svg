<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#bgGradient)"/>
  
  <!-- Clipboard document -->
  <g filter="url(#shadow)">
    <!-- Clipboard body -->
    <rect x="136" y="96" width="240" height="340" rx="16" ry="16" fill="#ffffff"/>
    
    <!-- Clipboard clip at top -->
    <rect x="196" y="76" width="120" height="40" rx="10" ry="10" fill="#e2e8f0"/>
    <rect x="216" y="86" width="80" height="20" rx="6" ry="6" fill="#94a3b8"/>
    
    <!-- Document lines -->
    <rect x="166" y="150" width="180" height="12" rx="4" ry="4" fill="#cbd5e1"/>
    <rect x="166" y="180" width="140" height="12" rx="4" ry="4" fill="#cbd5e1"/>
    <rect x="166" y="210" width="160" height="12" rx="4" ry="4" fill="#cbd5e1"/>
    <rect x="166" y="240" width="120" height="12" rx="4" ry="4" fill="#cbd5e1"/>
    <rect x="166" y="270" width="170" height="12" rx="4" ry="4" fill="#cbd5e1"/>
    
    <!-- Warning circle with exclamation -->
    <circle cx="346" cy="354" r="56" fill="#e74c3c"/>
    <text x="346" y="385" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  </g>
  
  <!-- Small educational accent (book icon) -->
  <g transform="translate(156, 320)">
    <rect x="0" y="0" width="32" height="24" rx="3" ry="3" fill="#fbbf24" opacity="0.9"/>
    <line x1="16" y1="0" x2="16" y2="24" stroke="#f59e0b" stroke-width="2"/>
    <line x1="4" y1="6" x2="13" y2="6" stroke="#f59e0b" stroke-width="2"/>
    <line x1="19" y1="6" x2="28" y2="6" stroke="#f59e0b" stroke-width="2"/>
    <line x1="4" y1="12" x2="13" y2="12" stroke="#f59e0b" stroke-width="2"/>
    <line x1="19" y1="12" x2="28" y2="12" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>